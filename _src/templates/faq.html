<body>
  <header>
    <div class="logo"><img src="img/intro/logo.webp" alt="Antarctic Music Studios logo" width="220" height="51"></div>
    <div class="menu-toggle" onclick="toggleMenu()" role="button" aria-label="Menu">
      <i class="fas fa-bars"></i>
    </div>
    <nav id="navbar">
      <a href="/">About</a>

	<section id="studio-gallery" style="padding-left: 50px; padding-right: 50px;">
	<br><br><br><br><br><br>

		<h2 style="text-align: center; margin-bottom: 1rem;">{{faq.heading}}</h2>

{{#each faq.sections}}		<h3>{{title}}</h3>
		<p>
		{{body}}
		</p>
		<br>

{{/each}}
	</section>

  <section id="contact">
    <!-- Your contact form code here -->
     <div class="section-title">
				<h2>{{faq.contactHeading}}</h2>
                <p>{{faq.contactBlurb}}</p>

			</div>
			<form class="contact-form" action="{{contact.formAction}}" method="POST">
				<div class="row">
					<div class="col-lg-4">
						<input type="text" placeholder="Your Name" name="name" required>
					</div>
					<div class="col-lg-4">
						<input type="text" placeholder="Your E-mail" name="_replyto" required>
					</div>
					<div class="col-lg-4">
						<input type="text" placeholder="Subject" name="subject" required>
					</div>
					<div class="col-lg-12">
						<input type="text" placeholder="Message" name="msg" required>
						<div class="text-center">
							<button class="site-btn" value="Send">SEND IT!</button>
						</div>
					</div>
				</div>
			</form>
            <div class="ft-contact-widget">
            <p><a href="{{contact.instagram}}" target="_blank"><i class="fa-brands fa-instagram"> </i> @antarcticstudios</a></p>
							<p><a href="{{contact.facebook}}" target="_blank"><i class="fa-brands fa-facebook"></i> @antarcticstudios </a></p>
							<p><a href="mailto:{{contact.email}}"><i class="fa fa-envelope"></i> {{contact.email}}</a></p>
							<p><a href="tel:{{contact.phoneHref}}"><i class="fa fa-phone"></i> {{contact.phone}}</a></p>
							<p><a href="{{contact.mapUrl}}" target="_blank"><i class="fa-solid fa-map-pin"></i> {{contact.address}}</a></p>
							<br>
							<p><a href="{{contact.musoUrl}}" target="_blank">More credits</a></a></p>
            </div>
  </section>


  <script>
    function toggleMenu() {
      const nav = document.getElementById('navbar');
      nav.classList.toggle('active');
    }
